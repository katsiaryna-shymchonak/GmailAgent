<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gmail Reader</title>
    <style>
      :root {
        --bg: #181b20;
        --card-bg: #23262b;
        --card-shadow: 0 4px 22px 0 #0002;
        --accent: #3e8ef7;
        --accent-light: #90b4ed;
        --text-main: #e1edfb;
        --text-secondary: #a3bedb;
        --button-hover: #5691fa;
        --radius: 14px;
      }
      body.light {
        --bg: #f5f8fc;
        --card-bg: #fff;
        --card-shadow: 0 4px 16px 0 #bfc9e333;
        --accent: #2253e6;
        --accent-light: #2e4482;
        --text-main: #212c3b;
        --text-secondary: #2d425a;
        --button-hover: #396be2;
      }
      body {
        background: var(--bg);
        color: var(--text-main);
        font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-width: 360px;
        min-height: 460px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: var(--card-bg);
        box-shadow: var(--card-shadow);
        border-radius: var(--radius);
        padding: 1.2rem 1.1rem 1rem 1.1rem;
        max-width: 380px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.88rem;
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.25em;
      }
      h2 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: 0.04em;
        font-weight: 700;
        color: var(--accent-light);
        text-align: left;
        flex: 1;
      }
      #theme-toggle {
        cursor: pointer;
        background: none;
        border: none;
        font-size: 1.36em;
        line-height: 1;
        margin-left: 0.2em;
        color: var(--accent-light);
        transition: color 0.17s;
      }
      #theme-toggle:hover,
      #theme-toggle:focus {
        color: var(--accent);
      }

      #sender-list {
        background: var(--card-bg);
        border-radius: 9px;
        box-shadow: 0 1px 3px 0 #0003;
        overflow-y: auto;
        max-height: 130px;
        padding: 0.3em 0.2em;
      }
      .sender-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6em;
        padding: 0.5em 0.6em;
        border-radius: 7px;
        cursor: pointer;
        color: var(--text-main);
        transition: background 0.12s;
      }
      .sender-item:hover,
      .sender-item.active {
        background: #2a313a;
      }
      body.light .sender-item:hover,
      body.light .sender-item.active {
        background: #e7f0ff;
      }
      .sender-name {
        font-weight: 600;
        color: var(--accent-light);
      }
      .sender-email {
        font-size: 0.9em;
        color: var(--text-secondary);
      }
      .sender-count {
        font-size: 0.85em;
        color: var(--text-secondary);
      }

      #email-list {
        background: var(--card-bg);
        border-radius: 9px;
        box-shadow: 0 1px 3px 0 #0003;
        margin-bottom: 0.3rem;
        overflow-y: auto;
        max-height: 205px;
        padding: 0.2em 0.1em;
        display: flex;
        flex-direction: column;
        gap: 0.1em;
      }
      .email-list-header {
        display: flex;
        align-items: center;
        gap: 0.45em;
        padding: 0.4em 0.6em;
        color: var(--text-secondary);
        position: sticky;
        top: 0;
        background: var(--card-bg);
        z-index: 1;
      }
      #select-all {
        accent-color: var(--accent);
      }
      .email-list-item {
        display: flex;
        align-items: flex-start;
        gap: 0.7em;
        border-radius: 6px;
        padding: 0.52em 0.7em 0.38em 0.3em;
        margin-bottom: 0.09em;
        cursor: pointer;
        transition:
          background 0.13s,
          box-shadow 0.13s;
      }
      .email-list-item.selected,
      .email-list-item:hover {
        background: var(--accent-light);
        color: #fff;
      }
      .email-checkbox {
        margin-top: 0.35em;
        accent-color: var(--accent);
      }
      .email-list-info {
        flex: 1;
      }
      .email-list-subject {
        font-weight: 610;
        font-size: 1em;
        color: var(--accent-light);
        margin-bottom: 0.13em;
      }
      .email-list-meta {
        font-size: 0.85em;
        color: var(--text-secondary);
        margin-bottom: 0.07em;
      }
      .email-list-snippet {
        font-size: 0.95em;
        color: var(--text-main);
      }

      #detail-panel {
        margin-top: 0.2rem;
        background: var(--bg);
        color: var(--text-main);
        border-radius: 8px;
        padding: 0.9em 0.6em 0.7em 0.8em;
        min-height: 54px;
        font-size: 1.04em;
        box-shadow: 0 1px 4px 0 #0002;
        word-break: break-word;
      }
      body.light #detail-panel {
        background: #f3f8ff;
        color: var(--text-main);
      }

      #send-to-ai {
        width: fit-content;
        align-self: flex-end;
        margin-top: 0.15em;
        margin-bottom: 0.04em;
        background: var(--accent);
        color: #fff;
        padding: 0.58em 1.08em;
        font-size: 1em;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      #send-to-ai:disabled {
        background: #778aa4;
        cursor: not-allowed;
      }

      #spinner {
        display: none;
        margin: 0 auto;
        margin-bottom: -14px;
        margin-top: -8px;
      }
      .loader {
        border: 2.5px solid #4550c7;
        border-top: 2.5px solid #bcd2f7;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="header-row">
        <h2>📧 Latest Gmail Messages</h2>
        <button
          id="theme-toggle"
          title="Toggle light/dark mode"
          aria-label="Toggle light or dark mode"
        >
          🌙
        </button>
      </div>
      <div id="sender-list">Loading senders...</div>
      <div id="email-list">Select a sender to load messages.</div>
      <button id="send-to-ai" disabled>Send Selected to AI</button>
      <div id="spinner"><div class="loader"></div></div>
      <div id="detail-panel">Select an email to preview...</div>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
